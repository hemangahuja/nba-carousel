<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
    }
    h1 { font-size: 16px; margin: 0 0 4px; color: #ff6b35; }
    .sub { font-size: 11px; color: #888; margin-bottom: 12px; }
    .status { font-size: 12px; color: #aaa; min-height: 16px; margin-bottom: 10px; }
    .status.error { color: #f87171; }
    .status.ok { color: #4ade80; }
    .games { max-height: 340px; overflow-y: auto; margin-bottom: 12px; }
    .game {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 9px 10px;
      border: 1px solid #2a2a2a;
      border-radius: 9px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .game:hover { border-color: #ff6b35; }
    .game input { margin-top: 3px; accent-color: #ff6b35; }
    .game .name { font-size: 13px; font-weight: 600; }
    .game .meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .empty { font-size: 12px; color: #888; padding: 14px 4px; text-align: center; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: #ff6b35;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #ff8c4d; }
    button:disabled { background: #3a3a3a; color: #777; cursor: default; }
    button.secondary { background: #2a2a2a; }
    button.secondary:hover:not(:disabled) { background: #3a3a3a; }
    .hint { font-size: 10px; color: #666; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>NBA Stream Carousel</h1>
  <div class="sub">Pick any live games · HQ active, low quality in the background</div>
  <div class="status" id="status">Loading live games…</div>
  <div class="games" id="games"></div>
  <div class="row">
    <button id="enable" disabled>Enable Carousel</button>
    <button id="close" class="secondary">Close</button>
  </div>
  <div class="hint">← → switch streams · quality per stream in the top bar · Esc returns to multiview</div>
  <script src="popup.js"></script>
</body>
</html>
